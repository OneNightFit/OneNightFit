<p class="product-actions">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-product-{{ product.id }}"
            aria-label="Hapus {{ product.name }}"
            title="Hapus Produk">
        Hapus
    </button>
</p>
<div id="delete-product-{{ product.id }}"
     class="product-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-product-title-{{ product.id }}">
    <button type="button"
            class="product-delete-modal__backdrop"
            popovertarget="delete-product-{{ product.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="product-delete-modal__content">
        <button type="button"
                class="product-delete-modal__close"
                popovertarget="delete-product-{{ product.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-product-title-{{ product.id }}">Hapus produk?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ product.title }}</strong>?
        </p>
        <div class="product-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-product-{{ product.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_product' product.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
