<div id="update-product-modal"
     class="product-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="update-product-modal-title">
    <button type="button"
        class="product-form-modal__backdrop"
        popovertarget="update-product-modal"
        popovertargetaction="hide"
        aria-label="Tutup form update product"></button>

    <div class="product-form-modal__content">
        <button type="button"
            class="product-form-modal__close"
            popovertarget="update-product-modal"
            popovertargetaction="hide"
            aria-label="Tutup form update product">×</button>

        <h2 id="update-product-modal-title">Edit Produk</h2>
        <form id="update-product-form" method="post" enctype="multipart/form-data" action="" class="product-form">
            {% csrf_token %}
            {% for field in update_form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="product-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="update-product-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
