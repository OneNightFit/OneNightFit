{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    {% block meta %} {% endblock meta %}
    <title>{% block title %}OneNightFit{% endblock title %}</title>
</head>

<body>
    <header class="site-header">
        <a href="#" class="brand"><img src="static/img/logo.img" alt="OneNightFit Logo"></a>
        <nav>
            <a href="#" class="body_1 desktop-only">Products</a>
            <a href="#" class="body_1 desktop-only">Inspo</a>
            {% if user.is_authenticated %}
                <span class="button button_text">{{ user.username }}</span>
                <a href="#">Logout</a>
            {% else %}
                <a href="#" class="body_1 button button_primary">Login/Sign Up</a>
            {% endif %}
            <div class="hamburg_menu mobile-only"> <a href="#" class="icon nav-hamburg-menu"></a></div>
        </nav>
    </header>

    <main class="container main-content">
        {% block content %} {% endblock content %}
    </main>

    <footer class="site-footer">
    <div class="container footer-inner">
        <div class="footer-left">
            <a href="{% url 'main:show_main' %}" class="brand">
                <img src="{% static 'img/logo.png' %}" alt="OneNightFit Logo" class="brand-logo">
            </a>
            <p class="footer-copy">&copy; OneNightFit 2026. All rights reserved.</p>
        </div>
        <div class="footer-social">
            <a href="#" class="social-icon" aria-label="WhatsApp">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"></circle></svg>
            </a>
            <a href="#" class="social-icon" aria-label="Line">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"></circle></svg>
            </a>
            <a href="#" class="social-icon" aria-label="Tiktok">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"></circle></svg>
            </a>
            <a href="#" class="social-icon" aria-label="Instagram">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"></circle></svg>
            </a>
        </div>
    </div>
    </footer>
</body>
</html>
